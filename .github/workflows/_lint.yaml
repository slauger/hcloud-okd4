name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Lint workflows
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.*)$
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

      # Same versions as the toolbox image (Dockerfile)
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          # renovate: datasource=docker depName=docker.io/hashicorp/terraform
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.66.0

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Set up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          # renovate: datasource=docker depName=docker.io/hashicorp/packer
          version: 1.16.3

      - name: Packer format
        run: packer fmt -check -recursive packer

      - name: Packer validate
        working-directory: packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the hcloud builder requires a token, validate does not use it
          HCLOUD_TOKEN: dummy
        run: |
          packer init .
          sha256=$(printf '0%.0s' {1..64})
          for os in fcos rhcos; do
            for arch in x86 arm; do
              packer validate -var os=$os -var architecture=$arch \
                -var url=https://example.com/$os.qcow2.gz -var sha256="$sha256" .
            done
          done
