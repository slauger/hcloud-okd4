name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Lint workflows
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.*)$
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color

      # Same versions as the toolbox image (Dockerfile)
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # renovate: datasource=docker depName=docker.io/hashicorp/terraform
          terraform_version: v1.16.6
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: v0.64.0

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint --recursive -f compact

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          # renovate: datasource=docker depName=docker.io/hashicorp/packer
          version: 1.16.1

      - name: Packer format
        run: packer fmt -check -recursive packer

      - name: Packer validate
        working-directory: packer
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the hcloud builder requires a token, validate does not use it
          HCLOUD_TOKEN: dummy
        run: |
          packer init .
          sha256=$(printf '0%.0s' {1..64})
          for os in fcos rhcos; do
            for arch in x86 arm; do
              packer validate -var os=$os -var architecture=$arch \
                -var url=https://example.com/$os.qcow2.gz -var sha256="$sha256" .
            done
          done
